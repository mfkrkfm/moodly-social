version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: moodly-mysql
    profiles: ["prod"]
    environment:
      MYSQL_DATABASE: moodly
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./moodly-social-api
    container_name: moodly-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_USER: ${DATABASE_USER:-}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-devSecretKeyForJwt123456789012345678901234567890}
    volumes:
      - ./logs:/app/logs

  gateway:
    build: ./moodly-social-web
    container_name: moodly-gateway
    ports:
      - "5000:5000"
    depends_on:
      - backend

volumes:
  mysql_data: