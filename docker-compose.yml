version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: moodly-mysql
    restart: always
    environment:
      MYSQL_DATABASE: moodly
      MYSQL_USER: moodly_user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./moodly-social-api
    container_name: moodly-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:mysql://mysql:3306/moodly?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USER: moodly_user
      DATABASE_PASSWORD: password
      JWT_SECRET: prodSecretKeyForJwt123456789012345678901234567890
    depends_on:
      - mysql
    volumes:
      - ./logs:/app/logs

  gateway:
    build: ./moodly-social-web
    container_name: moodly-gateway
    ports:
      - "5000:5000"
    depends_on:
      - backend

volumes:
  mysql_data: