services:
  backend:
    env_file:
      - .env.docker
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    container_name: moodly-mysql
    env_file:
      - .env.docker
    environment:
      - MYSQL_DATABASE=moodly
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
